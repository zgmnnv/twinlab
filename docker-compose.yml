# TwinLab — lean business-process digital twin.
#
#   docker compose up -d                 core stack (db + twin-service + superset + web)
#   docker compose --profile reports up   + Superset Alerts & Reports (redis, celery, mailhog)
#   docker compose --profile notebooks up + Jupyter Lab for ad-hoc analysis
#
# Everything talks over the internal network; the nginx gateway is the only
# entrypoint (http://localhost:8080).

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-twin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twin}
  POSTGRES_DB: ${POSTGRES_DB:-twin}

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: twinlab-postgres
    environment: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [twinlab]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twin} -d ${POSTGRES_DB:-twin}"]
      interval: 10s
      timeout: 5s
      retries: 10

  twin-service:
    build: ./twin-service
    container_name: twinlab-twin-service
    environment:
      TWIN_DATABASE_URL: postgresql://${POSTGRES_USER:-twin}:${POSTGRES_PASSWORD:-twin}@postgres:5432/${POSTGRES_DB:-twin}
      TWIN_SEED_DEMO: ${TWIN_SEED_DEMO:-true}
      TWIN_CORS_ORIGINS: ${TWIN_CORS_ORIGINS:-*}
    networks: [twinlab]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  superset:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile.superset
    container_name: twinlab-superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-32-chars-minimum-please-000}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_FIRSTNAME: Admin
      SUPERSET_ADMIN_LASTNAME: User
      SUPERSET_ADMIN_EMAIL: admin@twinlab.local
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-twin}:${POSTGRES_PASSWORD:-twin}@postgres:5432/superset
      TWIN_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-twin}:${POSTGRES_PASSWORD:-twin}@postgres:5432/${POSTGRES_DB:-twin}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - superset_home:/app/superset_home
      - ./config/superset/superset_config.py:/app/superset_config.py:ro
      - ./config/superset/assets:/app/assets:ro
    networks: [twinlab]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    container_name: twinlab-gateway
    ports:
      - "${TWINLAB_PORT:-8080}:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./webapp:/usr/share/nginx/html:ro
    networks: [twinlab]
    restart: unless-stopped
    depends_on:
      twin-service:
        condition: service_healthy
      superset:
        condition: service_started

  # --- optional: Superset Alerts & Reports -------------------------------
  redis:
    image: redis:7-alpine
    container_name: twinlab-redis
    profiles: [reports]
    volumes: [redis_data:/data]
    networks: [twinlab]
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile.superset
    container_name: twinlab-celery-worker
    profiles: [reports]
    command: celery --app=superset.tasks.celery_app:app worker --loglevel=info
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-32-chars-minimum-please-000}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-twin}:${POSTGRES_PASSWORD:-twin}@postgres:5432/superset
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      REDIS_URL: redis://redis:6379/0
    volumes:
      - superset_home:/app/superset_home
      - ./config/superset/superset_config.py:/app/superset_config.py:ro
    networks: [twinlab]
    restart: unless-stopped
    depends_on: [redis, postgres, superset]

  celery-beat:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile.superset
    container_name: twinlab-celery-beat
    profiles: [reports]
    command: celery --app=superset.tasks.celery_app:app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-32-chars-minimum-please-000}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-twin}:${POSTGRES_PASSWORD:-twin}@postgres:5432/superset
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      REDIS_URL: redis://redis:6379/0
    volumes:
      - superset_home:/app/superset_home
      - ./config/superset/superset_config.py:/app/superset_config.py:ro
    networks: [twinlab]
    restart: unless-stopped
    depends_on: [redis, postgres, superset]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: twinlab-mailhog
    profiles: [reports]
    networks: [twinlab]
    restart: unless-stopped

  # --- optional: Jupyter Lab -------------------------------------------------
  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile.jupyter
    container_name: twinlab-jupyter
    profiles: [notebooks]
    environment:
      TWIN_DATABASE_URL: postgresql://${POSTGRES_USER:-twin}:${POSTGRES_PASSWORD:-twin}@postgres:5432/${POSTGRES_DB:-twin}
    volumes:
      - ./notebooks:/home/jovyan/work
    networks: [twinlab]
    restart: unless-stopped
    depends_on: [postgres]

volumes:
  postgres_data:
  superset_home:
  redis_data:

networks:
  twinlab:
    driver: bridge
