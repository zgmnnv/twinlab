services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - twinlab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - twinlab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile.superset
    container_name: superset
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      - SUPERSET_CONFIG_PATH=/app/superset_config.py
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
      - SMTP_SSL=${SMTP_SSL:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_MAIL_FROM=${SMTP_MAIL_FROM:-noreply@superset.com}
      - WEBDRIVER_BASEURL=http://superset:8088
      - WEBDRIVER_BASEURL_USER_FRIENDLY=http://localhost:8088
      - ALERT_REPORTS_WEBDRIVER_BASEURL=http://superset:8088
      - ALERT_REPORTS_WEBDRIVER_BASEURL_USER_FRIENDLY=http://localhost:8088
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - WEBDRIVER_BASEURL=http://superset:8088
      - WEBDRIVER_BASEURL_USER_FRIENDLY=http://localhost:8088
    volumes:
      - superset_home:/app/superset_home
      - superset_static:/app/superset/static
      - ./config/superset/superset_config.py:/app/superset_config.py
    networks:
      - twinlab-network
    restart: unless-stopped
    depends_on:
      - redis
      - postgres

  celery-worker:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile.superset
    container_name: celery-worker
    command: celery --app=superset.tasks.celery_app:app worker --loglevel=info
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - WEBDRIVER_BASEURL=http://superset:8088
      - WEBDRIVER_BASEURL_USER_FRIENDLY=http://localhost:8088
      - ALERT_REPORTS_WEBDRIVER_BASEURL=http://superset:8088
      - ALERT_REPORTS_WEBDRIVER_BASEURL_USER_FRIENDLY=http://localhost:8088
    volumes:
      - superset_home:/app/superset_home
      - superset_static:/app/superset/static
      - ./config/superset/superset_config.py:/app/superset_config.py
    networks:
      - twinlab-network
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
      - superset

  celery-beat:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile.superset
    container_name: celery-beat
    command: celery --app=superset.tasks.celery_app:app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - WEBDRIVER_BASEURL=http://superset:8088
      - WEBDRIVER_BASEURL_USER_FRIENDLY=http://localhost:8088
      - ALERT_REPORTS_WEBDRIVER_BASEURL=http://superset:8088
      - ALERT_REPORTS_WEBDRIVER_BASEURL_USER_FRIENDLY=http://localhost:8088
    volumes:
      - superset_home:/app/superset_home
      - superset_static:/app/superset/static
      - ./config/superset/superset_config.py:/app/superset_config.py
    networks:
      - twinlab-network
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
      - superset

  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile.jupyter
    container_name: jupyter
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      - NB_UID=1000
      - NB_GID=1000
    volumes:
      - ./notebooks:/home/jovyan/work
      - jupyter_static:/home/jovyan/.local/share/jupyter
    user: "0:0"  # Run as root initially to fix permissions
    networks:
      - twinlab-network
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: docker/webapp/Dockerfile.webapp
    container_name: webapp
    ports:
      - "80:80"
    networks:
      - twinlab-network
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    networks:
      - twinlab-network
    restart: unless-stopped

volumes:
  superset_home:
  superset_static:
  jupyter_static:
  postgres_data:
  redis_data:

networks:
  twinlab-network:
    driver: bridge
