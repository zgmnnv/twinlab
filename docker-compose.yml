  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  superset:
    build:
      context: ./docker/superset
      dockerfile: Dockerfile.superset
    container_name: superset
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      - SUPERSET_CONFIG_PATH=/app/superset_config.py
    volumes:
      - superset_home:/app/superset_home
      - superset_static:/app/superset/static
      - ./config/superset/superset_config.py:/app/superset_config.py
    command: >
      sh -c "
        superset db upgrade && \
        superset fab create-admin \
          --username ${SUPERSET_ADMIN_USERNAME} \
          --firstname ${SUPERSET_ADMIN_FIRSTNAME} \
          --lastname ${SUPERSET_ADMIN_LASTNAME} \
          --email ${SUPERSET_ADMIN_EMAIL} \
          --password ${SUPERSET_ADMIN_PASSWORD} || true && \
        superset load_examples && \
        superset init && \
        gunicorn -w 4 -k gevent --timeout 300 \
          --bind 0.0.0.0:8088 \
          --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-*} \
          'superset.app:create_app()'
      "

    networks:
      - twinlab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  jupyter:
    build:
      context: ./docker/jupyter
      dockerfile: Dockerfile.jupyter
    container_name: jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - jupyter_static:/home/jovyan/.local/share/jupyter
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=
      - NB_UID=1000
      - NB_GID=1000
    user: "1000:1000"
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password='' --NotebookApp.allow_origin='*' --NotebookApp.allow_root=True
    networks:
      - twinlab-network
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: docker/webapp/Dockerfile.webapp
    container_name: webapp
    ports:
      - "80:80"
    networks:
      - twinlab-network
    restart: unless-stopped

volumes:
  postgres_data:
  superset_home:
  superset_static:
  jupyter_static:

networks:
  twinlab-network:
    driver: bridge
