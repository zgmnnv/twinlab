  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB}
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - twinlab-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  superset:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile.superset
    container_name: superset
    ports:
      - "8088:8088"
    env_file:
      - .env
    volumes:
      - superset_home:/app/superset_home
      - superset_static:/app/superset/static
      - ./config/superset/superset_config.py:/app/superset_config.py
    networks:
      - twinlab-network
    restart: unless-stopped

  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile.jupyter
    container_name: jupyter
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      - NB_UID=1000
      - NB_GID=1000
    volumes:
      - ./notebooks:/home/jovyan/work
      - jupyter_static:/home/jovyan/.local/share/jupyter
    user: "0:0"  # Run as root initially to fix permissions
    networks:
      - twinlab-network
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: docker/webapp/Dockerfile.webapp
    container_name: webapp
    ports:
      - "80:80"
    networks:
      - twinlab-network
    restart: unless-stopped

volumes:
  superset_home:
  superset_static:
  jupyter_static:

networks:
  twinlab-network:
    driver: bridge
