<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TwinLab</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f5f7; --card:#fff; --ink:#1f2430; --muted:#6b7280; --accent:#3b5bdb; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --card:#1e2128; --ink:#e8eaed; --muted:#9aa0ab; --line:#2b2f38; } }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap { width:100%; max-width:760px; }
  h1 { font-size:1.8rem; letter-spacing:-.02em; }
  p.sub { color:var(--muted); margin:6px 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; transition:transform .15s, box-shadow .15s; }
  a.card:hover { transform:translateY(-3px); box-shadow:0 12px 24px rgba(0,0,0,.10); }
  .card h2 { font-size:1.05rem; margin-bottom:4px; }
  .card span { font-size:.85rem; color:var(--muted); }
  .card.primary { border-color:var(--accent); }
  .status { margin-top:22px; font-size:.85rem; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#9aa0ab; }
  .dot.up { background:#37b24d; }
  .dot.down { background:#e03131; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TwinLab</h1>
  <p class="sub">Цифровой двойник бизнес-процесса — схема потока, планирование, аналитика.</p>

  <div class="grid" id="grid"></div>

  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Проверка сервисов…</span></div>
</div>

<script>
const SERVICES = [
  { title: "Схема процесса",   href: "flow.html",     desc: "Живой 2D-поток двойника",        primary: true,  probe: "api/twins" },
  { title: "Apache Superset",  href: "analytics/",    desc: "Дашборды и аналитика",           probe: "analytics/health" },
  { title: "API двойника",     href: "api/docs",      desc: "REST + WebSocket (OpenAPI)",     probe: "api/health" },
  { title: "Jupyter Lab",      href: "jupyter/",      desc: "Ad-hoc анализ (профиль notebooks)", probe: "jupyter/api" },
];

const grid = document.getElementById("grid");
for (const s of SERVICES) {
  const a = document.createElement("a");
  a.className = "card" + (s.primary ? " primary" : "");
  a.href = s.href;
  a.innerHTML = `<h2>${s.title}</h2><span>${s.desc}</span>`;
  grid.appendChild(a);
}

(async () => {
  let ok = 0;
  await Promise.all(SERVICES.map(async s => {
    try { const r = await fetch(s.probe, { method: "GET" }); if (r.ok || r.status === 401 || r.status === 403) ok++; }
    catch (_) {}
  }));
  const dot = document.getElementById("dot"), txt = document.getElementById("statusText");
  if (ok === SERVICES.length) { dot.className = "dot up"; txt.textContent = "Все сервисы отвечают"; }
  else if (ok > 0) { dot.className = "dot up"; txt.textContent = `Доступно сервисов: ${ok} из ${SERVICES.length}`; }
  else { dot.className = "dot down"; txt.textContent = "Сервисы недоступны — запустите docker compose up"; }
})();
</script>
</body>
</html>
