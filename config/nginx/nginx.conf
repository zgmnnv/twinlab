worker_processes auto;

events { 
    worker_connections 1024; 
}

http {
    # Sensible defaults
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip compression for better performance
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/xml+rss 
        application/xml 
        image/svg+xml
        application/x-font-ttf
        font/opentype;

    # Upstreams to your Compose services
    upstream superset_upstream { 
        server superset:8088; 
        keepalive 32; 
    }
    upstream webapp_upstream { 
        server webapp:80;    
        keepalive 32; 
    }
    upstream jupyter_upstream { 
        server jupyter:8888; 
        keepalive 16; 
    }

    # WebSocket helpers (for Jupyter terminals and kernels)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name twinlab.local localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ---------------------------
        # TwinLab Frontend App at / (Main Service Navigator)
        # ---------------------------
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  $server_port;

            # Cache static assets
            location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                proxy_pass http://webapp_upstream;
            }

            proxy_pass http://webapp_upstream;
        }

        # ---------------------------
        # Apache Superset at /analytics/ (External Access with Prefix)
        # ---------------------------
        location /analytics/ {
            # This strips the prefix from the request URI before passing to Superset
            rewrite ^/analytics/?(.*)$ /$1 break;

            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # This header tells Superset it's behind a proxy at /analytics
            proxy_set_header X-Forwarded-Prefix /analytics;

            proxy_pass http://superset_upstream;
        }

        # ---------------------------
        # Handle Superset static assets and API calls
        # ---------------------------
        location /static/ {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header X-Forwarded-Prefix /static;
            proxy_pass http://superset_upstream;
        }

        # Handle Superset API calls
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_pass http://superset_upstream;
        }

        # ---------------------------
        # Jupyter Lab at /jupyter/ (External Access)
        # ---------------------------
        location /jupyter/ {
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  $server_port;

            # WebSocket headers for Jupyter terminals, kernels, etc.
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            # Jupyter-specific settings
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_buffering off;          # Important for notebook streaming
            client_max_body_size 50m;     # Large notebook files

            # Handle Jupyter's base_url properly
            proxy_redirect off;
            
            proxy_pass http://jupyter_upstream;
        }

        # ---------------------------
        # Health Check Endpoint
        # ---------------------------
        location /health {
            access_log off;
            return 200 "TwinLab services are healthy\n";
            add_header Content-Type text/plain;
        }

        # ---------------------------
        # Error Pages
        # ---------------------------
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            return 404 "Service not found. Available services: / (TwinLab), /analytics/ (Superset), /jupyter/ (Jupyter Lab)";
            add_header Content-Type text/plain;
        }
        
        location = /50x.html {
            return 500 "TwinLab service temporarily unavailable";
            add_header Content-Type text/plain;
        }
    }
}
