stages: [test, build]

twin-service-tests:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r twin-service/requirements.txt pytest
    - cd twin-service && python -m pytest -q
  rules:
    - changes: [twin-service/**/*]

compose-config:
  stage: test
  image: docker:27
  services: [docker:27-dind]
  script:
    - cp .env.example .env
    - docker compose config -q
  rules:
    - changes: [docker-compose.yml, .env.example, "docker/**/*", "config/**/*"]

build-images:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - cp .env.example .env
    - docker compose build
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
